# Standard Industrial Stress Battery for Robot Policies
# Tests across perception latency, frame drops, sensor noise, action noise, and gripper slip

sweep:
  obs_latency_steps: [0, 1, 2, 4, 8]
  obs_noise_std: [0.0, 0.02, 0.05, 0.1, 0.2]
  frame_drop_prob: [0.0, 0.05, 0.1, 0.2, 0.35]
  action_noise_std: [0.0, 0.02, 0.05, 0.1, 0.2]
  grip_slip_prob: [0.0, 0.05, 0.1, 0.2, 0.35]
  reach_clamp_fraction: [1.0, 0.9, 0.8, 0.6, 0.4]

episodes_per_cell: 5
seed: 42
mode: marginal
