[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-robotics"
version = "0.1.0"
description = "Automated reliability boundary discovery and failure diagnosis for robot policies"
readme = "README.md"
authors = [
    { name = "Jona Joy", email = "jonajoy142@gmail.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
keywords = ["robotics", "reliability", "evaluation", "fault-injection", "vla", "embodied-ai", "testing"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
pandas = ["pandas>=2.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
alpha = "alpha_robotics.cli:main"

[project.urls]
Homepage = "https://github.com/jonajoy142/alpha-robotics"
Repository = "https://github.com/jonajoy142/alpha-robotics.git"
Issues = "https://github.com/jonajoy142/alpha-robotics/issues"
Paper = "https://arxiv.org/abs/2610.30197"

